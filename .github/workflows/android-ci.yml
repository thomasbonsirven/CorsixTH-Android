name: Android CI

on:
  push:
    branches: 
      - 'dev'
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    # Runner GAMING labels: self-hosted, Windows, X64
    runs-on: [self-hosted, Windows, X64]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build debug APK (community-safe)
      shell: powershell
      run: .\gradlew.bat createGameZip assembleCommunityDebug --no-daemon