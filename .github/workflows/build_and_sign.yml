name: Build Signed Release

on:
  push:
    branches: 
      - 'master'
      - 'dev'

jobs:
  build:
    # Runner GAMING labels: self-hosted, Windows, X64
    runs-on: [self-hosted, Windows, X64]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Decode Keystore
      id: decode_keystore
      uses: timheuer/base64-to-file@v1.2
      with:
        fileName: 'android_keystore.jks'
        encodedString: ${{ secrets.KEYSTORE }}
    - name: Decode Google Services Info
      uses: timheuer/base64-to-file@v1.2
      with:
        fileName: 'google-services.json'
        fileDir: '.'
        encodedString: ${{ secrets.GOOGLE_SERVICES_JSON }}
    - name: Set snapshot
      if: github.ref == 'refs/heads/dev'
      shell: powershell
      run: |
        "IS_SNAPSHOT=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    - name: Build APK and app bundle
      shell: powershell
      run: .\gradlew.bat bundleRelease assembleRelease --no-daemon
      env:
        RELEASE_STORE_FILE: ${{ steps.decode_keystore.outputs.filePath }}
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        BUILD_NUMBER: ${{ github.run_number }}
    - name: Upload crashlytics symbols
      shell: powershell
      run: .\gradlew.bat uploadCrashlyticsSymbolFileRelease --no-daemon
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AppBundle
        path: build/outputs/bundle/release/*
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: APK
        path: build/outputs/apk/release/*
    - name: Set version variables
      shell: powershell
      run: |
        $ver = (Get-Content version.txt -Raw).Trim()
        "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    - name: Create/Update Github Snapshot Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/dev'
      with:
        tag_name: ${{ env.VERSION }}
        name: ${{ env.VERSION }}
        prerelease: true
        body: 'Snapshot release (self-hosted GAMING)'
        files: build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish Snapshot to Play Store
      uses: swootte/upload-google-play@V1.1.5
      if: github.ref == 'refs/heads/dev'
      with:
        serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        packageName: uk.co.armedpineapple.cth
        releaseFiles: build/outputs/bundle/release/*.aab
        track: alpha
        status: completed
        whatsNewDirectory: distribution/snapshot
        changesNotSentForReview: false
