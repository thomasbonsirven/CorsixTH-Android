# Pre-release APK on the self-hosted GAMING runner (Windows / X64).
name: Pre-release APK

on:
  push:
    tags:
      - 'v*-pre-release'
  workflow_dispatch:
    inputs:
      build_version:
        description: 'BUILD_VERSION / release name (e.g. 0.70.1-pre-release)'
        required: true
        default: '0.70.1-pre-release'

permissions:
  contents: write

jobs:
  build-and-release:
    # Labels on runner GAMING: self-hosted, Windows, X64
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Resolve Android SDK (self-hosted)
        shell: powershell
        run: |
          $sdk = $env:ANDROID_HOME
          if ([string]::IsNullOrWhiteSpace($sdk)) { $sdk = $env:ANDROID_SDK_ROOT }
          if ([string]::IsNullOrWhiteSpace($sdk)) {
            $candidates = @(
              "$env:LOCALAPPDATA\Android\Sdk",
              "$env:USERPROFILE\AppData\Local\Android\Sdk",
              "E:\000-lastBeacon_ia\android-sdk",
              "C:\Android\Sdk",
              "E:\Android\Sdk"
            )
            foreach ($c in $candidates) {
              if ((Test-Path "$c\platform-tools") -or (Test-Path "$c\platforms")) {
                $sdk = $c
                break
              }
            }
          }
          if ([string]::IsNullOrWhiteSpace($sdk) -or -not (Test-Path $sdk)) {
            throw "Android SDK not found. Set ANDROID_HOME on the GAMING runner."
          }
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # local.properties uses escaped backslashes (Gradle Properties format).
          $escaped = ($sdk -replace '\\', '/')
          "sdk.dir=$escaped" | Set-Content -Path local.properties -Encoding ascii
          Write-Host "ANDROID_HOME=$sdk"

      - name: Resolve version
        shell: powershell
        run: |
          $ver = "${{ github.event.inputs.build_version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $tag = "${{ github.ref_name }}"
            if ($tag.StartsWith("v")) { $ver = $tag.Substring(1) } else { $ver = $tag }
          }
          "BUILD_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=v$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "BUILD_VERSION=$ver"

      - name: Build release APK (short path)
        shell: powershell
        run: |
          # Windows ndk-build hits CreateProcess error 87 when the link line is too
          # long under GithubActions_Runner\_work\... Copy into a short real path.
          $short = "C:\cth-pr"
          if (Test-Path $short) { Remove-Item -Recurse -Force $short }
          New-Item -ItemType Directory -Path $short | Out-Null
          robocopy "$env:GITHUB_WORKSPACE" $short /E /NFL /NDL /NJH /NJS /nc /ns /np
          # robocopy exit codes 0-7 are success/partial
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with code $LASTEXITCODE" }
          "SHORT_WORKSPACE=$short" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Set-Location $short
          # Refresh local.properties for the copied tree
          $sdk = $env:ANDROID_HOME
          "sdk.dir=$($sdk -replace '\\','/')" | Set-Content -Path local.properties -Encoding ascii
          .\gradlew.bat createGameZip assembleCommunityRelease --no-daemon
        env:
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
          IS_SNAPSHOT: 'false'
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Stage APK artifact
        shell: powershell
        run: |
          $root = if ($env:SHORT_WORKSPACE) { $env:SHORT_WORKSPACE } else { $env:GITHUB_WORKSPACE }
          Set-Location $root
          New-Item -ItemType Directory -Force -Path distribution/pre-release | Out-Null
          $src = Get-ChildItem -Recurse build/outputs/apk/community/release/*.apk | Select-Object -First 1
          if (-not $src) {
            $src = Get-ChildItem -Recurse build/outputs/apk/**/release/*.apk | Select-Object -First 1
          }
          if (-not $src) { throw "No release APK found" }
          $dest = "distribution/pre-release/CorsixTH-Android-$($env:BUILD_VERSION).apk"
          Copy-Item $src.FullName $dest -Force
          Write-Host "Staged $dest ($($src.Length) bytes)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CorsixTH-Android-${{ env.BUILD_VERSION }}
          path: |
            distribution/pre-release/CorsixTH-Android-${{ env.BUILD_VERSION }}.apk
            distribution/pre-release/0.70.1-pre-release.md

      - name: Publish / update GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.BUILD_VERSION }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body_path: distribution/pre-release/0.70.1-pre-release.md
          files: |
            distribution/pre-release/CorsixTH-Android-${{ env.BUILD_VERSION }}.apk
            distribution/pre-release/0.70.1-pre-release.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
