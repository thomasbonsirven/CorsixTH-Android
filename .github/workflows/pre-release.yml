# Pre-release APK on the self-hosted GAMING runner (Windows / X64).
name: Pre-release APK

on:
  push:
    tags:
      - 'v*-pre-release'
  workflow_dispatch:
    inputs:
      build_version:
        description: 'BUILD_VERSION / release name (e.g. 0.70.1-pre-release)'
        required: true
        default: '0.70.1-pre-release'

jobs:
  build-and-release:
    # Labels on runner GAMING: self-hosted, Windows, X64
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Resolve version
        shell: powershell
        run: |
          $ver = "${{ github.event.inputs.build_version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $tag = "${{ github.ref_name }}"
            if ($tag.StartsWith("v")) { $ver = $tag.Substring(1) } else { $ver = $tag }
          }
          "BUILD_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=v$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "BUILD_VERSION=$ver"

      - name: Build release APK
        shell: powershell
        run: |
          # Community/local signing: omit RELEASE_STORE_* to use debug keystore.
          # Set KEYSTORE + RELEASE_* secrets on the repo for a real release signature.
          .\gradlew.bat createGameZip assembleRelease --no-daemon
        env:
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
          IS_SNAPSHOT: 'false'
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Stage APK artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path distribution/pre-release | Out-Null
          $src = Get-ChildItem -Recurse build/outputs/apk/release/*.apk | Select-Object -First 1
          if (-not $src) { throw "No release APK found" }
          $dest = "distribution/pre-release/CorsixTH-Android-$($env:BUILD_VERSION).apk"
          Copy-Item $src.FullName $dest -Force
          Copy-Item $src.FullName "build/outputs/apk/release/CorsixTH-Android-$($env:BUILD_VERSION).apk" -Force
          Write-Host "Staged $dest ($($src.Length) bytes)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CorsixTH-Android-${{ env.BUILD_VERSION }}
          path: |
            distribution/pre-release/CorsixTH-Android-${{ env.BUILD_VERSION }}.apk
            distribution/pre-release/0.70.1-pre-release.md

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.BUILD_VERSION }}
          prerelease: true
          generate_release_notes: false
          body_path: distribution/pre-release/0.70.1-pre-release.md
          files: |
            distribution/pre-release/CorsixTH-Android-${{ env.BUILD_VERSION }}.apk
            distribution/pre-release/0.70.1-pre-release.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
